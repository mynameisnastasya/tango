name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
      - name: Verify static Pages bundle
        run: |
          test -s index.html
          test -s site.css
          test -s site.js
          test -s admin.html
          node --check site.js
          grep -q "KCu4ZY" site.js
          grep -q "ABHI AGANCY" index.html
